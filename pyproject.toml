[project]
name = "mlops_wrapper"
version = "0.3.2"
description = "a unified mlflow wrapper for standardized ML model logging and registration."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "akaay", email = "s.a.ashok91@gmail.com" }
]
dependencies = [
    "mlflow>=2.9.0",
    "boto3>=1.28.0,<2.0.0"
]

[project.optional-dependencies]
compare = [
    "plotly>=5.0.0",
    "pandas>=1.3.0"
]

[project.scripts]
mlops = "mlops_wrapper.cli:main"

[project.urls]
Homepage = "https://github.com/Mukilesh-K/mlops_wrapper_v1"
Issues = "https://github.com/Mukilesh-K/mlops_wrapper_v1/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]